<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AztecCraft 3D: Survival & Empires</title>
    <style>
        * { touch-action: manipulation; box-sizing: border-box; user-select: none; }
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; background-color: #000; color: white; }
        
        canvas { width: 100% !important; height: 100% !important; display: block; }

        #login-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 100;
        }
        .card { background: #222; padding: 20px; border-radius: 12px; border: 2px solid #8b4513; text-align: center; max-width: 360px; width: 90%; }
        input, select, button { width: 100%; padding: 10px; margin: 6px 0; border-radius: 6px; border: none; font-size: 14px; }
        button { background: #d9534f; color: white; font-weight: bold; cursor: pointer; }

        /* Crosshair */
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 12px; height: 12px;
            transform: translate(-50%, -50%); pointer-events: none; z-index: 20;
        }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(255,255,255,0.8); }
        #crosshair::before { top: 5px; left: 0; width: 12px; height: 2px; }
        #crosshair::after { top: 0; left: 5px; width: 2px; height: 12px; }

        #hud { position: absolute; top: 10px; left: 10px; z-index: 10; text-shadow: 2px 2px 4px #000; font-size: 12px; pointer-events: none; }
        
        /* Hotbar Inventario */
        #inventory {
            position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 4px; background: rgba(0,0,0,0.8); padding: 4px; border-radius: 8px; z-index: 20;
        }
        .slot { width: 44px; height: 44px; border: 2px solid #666; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 9px; cursor: pointer; background: rgba(0,0,0,0.5); }
        .slot.selected { border-color: #ffd700; box-shadow: 0 0 10px #ffd700; background: rgba(255,215,0,0.2); }

        /* Zona Cámara */
        #touch-camera-zone { position: absolute; top: 0; right: 0; width: 55%; height: 70%; z-index: 5; }
        
        /* D-Pad */
        #dpad { position: absolute; bottom: 70px; left: 10px; width: 120px; height: 120px; z-index: 20; }
        .dbtn { position: absolute; background: rgba(255,255,255,0.25); border: 1px solid rgba(255,255,255,0.5); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; }
        #btn-up { top: 0; left: 40px; width: 40px; height: 40px; }
        #btn-down { bottom: 0; left: 40px; width: 40px; height: 40px; }
        #btn-left { top: 40px; left: 0; width: 40px; height: 40px; }
        #btn-right { top: 40px; right: 0; width: 40px; height: 40px; }

        /* Botones Acción */
        .act-btn { position: absolute; z-index: 20; border-radius: 8px; border: 2px solid white; font-weight: bold; font-size: 11px; display: flex; align-items: center; justify-content: center; color: white; text-align: center; }
        #btn-action { bottom: 70px; right: 15px; width: 70px; height: 70px; background: rgba(46, 204, 113, 0.7); }
        #btn-mode { bottom: 150px; right: 15px; width: 70px; height: 35px; background: rgba(52, 152, 219, 0.8); }
        #btn-jump { bottom: 70px; right: 95px; width: 50px; height: 50px; background: rgba(241, 196, 15, 0.7); border-radius: 50%; }

        #schematic-panel {
            position: absolute; top: 10px; right: 10px; z-index: 20;
            background: rgba(0,0,0,0.85); padding: 8px; border-radius: 8px; border: 1px solid #ffd700; max-width: 180px;
        }
        .sch-btn { padding: 3px; font-size: 10px; margin: 2px 0; background: #333; color: white; border: 1px solid #777; }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div id="login-modal">
        <div class="card">
            <h2 style="margin: 5px 0;">🗿 AztecCraft 3D</h2>
            <p style="font-size: 11px; color: #aaa; margin-bottom: 10px;">Supervivencia Procedural + Imperios</p>
            <input type="text" id="username" placeholder="Apodo / Nombre">
            <input type="password" id="user-pin" placeholder="PIN Secreto (4 dígitos)">
            <input type="text" id="world-name" placeholder="Nombre del Mundo">
            <select id="game-mode">
                <option value="supe">🍃 Supervivencia</option>
                <option value="hard">💀 Hardcore</option>
            </select>
            <button type="button" onclick="ingresarAlJuego()">¡Jugar Minecraft Azteca!</button>
        </div>
    </div>

    <div id="crosshair"></div>
    <div id="touch-camera-zone"></div>

    <div id="hud">
        <div>👤 <span id="hud-user">Jugador</span> | 🌍 <span id="hud-world">Mundo</span></div>
        <div>❤️ HP: <span id="hud-hp">100</span> | 🏆 Puntos: <span id="hud-score">0</span></div>
    </div>

    <div id="schematic-panel">
        <div style="font-size: 10px; font-weight: bold; color: #ffd700;">📜 Guía de Construcción</div>
        <select id="select-schema" style="font-size: 10px; padding: 2px; margin: 2px 0;" onchange="cambiarEsquema()">
            <option value="none">Ninguno</option>
            <option value="altar">Altar Azteca</option>
            <option value="piramide">Pirámide Sagrada</option>
        </select>
        <div id="schema-controls" style="display:none;">
            <button class="sch-btn" onclick="moverEsquema(0, 1)">⬆️ Adelante</button>
            <button class="sch-btn" onclick="moverEsquema(0, -1)">⬇️ Atrás</button>
            <button class="sch-btn" onclick="moverEsquema(-1, 0)">⬅️ Izq</button>
            <button class="sch-btn" onclick="moverEsquema(1, 0)">➡️ Der</button>
        </div>
    </div>

    <div id="dpad">
        <div id="btn-up" class="dbtn">▲</div>
        <div id="btn-down" class="dbtn">▼</div>
        <div id="btn-left" class="dbtn">◀</div>
        <div id="btn-right" class="dbtn">▶</div>
    </div>

    <div id="btn-mode" class="act-btn" onclick="toggleBuildMode()">MODO:<br><span id="mode-txt" style="color:#2ecc71;">COLOCAR</span></div>
    <div id="btn-action" class="act-btn" onclick="ejecutarAccion()">USAR<br>BLOQUE</div>
    <div id="btn-jump" class="act-btn">SALTAR</div>

    <div id="inventory">
        <div class="slot selected" id="slot-wood" onclick="selectSlot('wood')">Madera<br><b id="cnt-wood">0</b></div>
        <div class="slot" id="slot-leaves" onclick="selectSlot('leaves')">Hojas<br><b id="cnt-leaves">0</b></div>
        <div class="slot" id="slot-sapling" onclick="selectSlot('sapling')">Brote🌱<br><b id="cnt-sapling">0</b></div>
        <div class="slot" id="slot-stone" onclick="selectSlot('stone')">Piedra<br><b id="cnt-stone">0</b></div>
        <div class="slot" id="slot-grass" onclick="selectSlot('grass')">Pasto<br><b id="cnt-grass">0</b></div>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyBDE_6jIBeW-xAbPF7FWLsUlEDv4toHmVk",
          authDomain: "azteccraft-80bc2.firebaseapp.com",
          databaseURL: "https://azteccraft-80bc2-default-rtdb.firebaseio.com",
          projectId: "azteccraft-80bc2"
        };
        let db = null;
        try { firebase.initializeApp(firebaseConfig); db = firebase.database(); } catch(e){}

        let currentUser = "Jugador", currentWorld = "Mundo1", userPin = "";
        let score = 0, hp = 100, activeBlock = "wood", buildMode = true;
        let inventory = { wood: 0, leaves: 0, sapling: 0, stone: 0, grass: 0 };

        // Escena y Renderizador
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x7ec0ee);
        scene.fog = new THREE.FogExp2(0x7ec0ee, 0.025);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // Control de Redimensionamiento (Arregla pantalla negra al girar)
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const light = new THREE.DirectionalLight(0xffffff, 1.2);
        light.position.set(30, 50, 30);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x555555));

        const materials = {
            grass: new THREE.MeshLambertMaterial({ color: 0x4aa02c }),
            stone: new THREE.MeshLambertMaterial({ color: 0x707070 }),
            wood: new THREE.MeshLambertMaterial({ color: 0x5c4033 }),
            leaves: new THREE.MeshLambertMaterial({ color: 0x2d8a1e, transparent: true, opacity: 0.9 }),
            sapling: new THREE.MeshLambertMaterial({ color: 0x00ff00 }),
            guide: new THREE.MeshBasicMaterial({ color: 0xffd700, wireframe: true })
        };
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const blocks = [];

        function getTerrainHeight(x, z) {
            return Math.floor(Math.sin(x * 0.2) * Math.cos(z * 0.2) * 2) + 1;
        }

        const mapSize = 14;
        for (let x = -mapSize; x <= mapSize; x++) {
            for (let z = -mapSize; z <= mapSize; z++) {
                let h = getTerrainHeight(x, z);
                const topBlock = new THREE.Mesh(geometry, materials.grass);
                topBlock.position.set(x, h, z);
                topBlock.userData = { type: 'grass' };
                scene.add(topBlock);
                blocks.push(topBlock);

                const subBlock = new THREE.Mesh(geometry, materials.stone);
                subBlock.position.set(x, h - 1, z);
                subBlock.userData = { type: 'stone' };
                scene.add(subBlock);
                blocks.push(subBlock);

                if (Math.random() < 0.04 && Math.abs(x) > 2 && Math.abs(z) > 2) {
                    generarArbol(x, h + 1, z);
                }
            }
        }

        function generarArbol(x, y, z) {
            for (let i = 0; i < 3; i++) {
                const trunk = new THREE.Mesh(geometry, materials.wood);
                trunk.position.set(x, y + i, z);
                trunk.userData = { type: 'wood' };
                scene.add(trunk);
                blocks.push(trunk);
            }
            for (let lx = -1; lx <= 1; lx++) {
                for (let lz = -1; lz <= 1; lz++) {
                    for (let ly = 2; ly <= 3; ly++) {
                        if (lx === 0 && lz === 0 && ly === 2) continue;
                        const leaf = new THREE.Mesh(geometry, materials.leaves);
                        leaf.position.set(x + lx, y + ly, z + lz);
                        leaf.userData = { type: 'leaves' };
                        scene.add(leaf);
                        blocks.push(leaf);
                    }
                }
            }
        }

        camera.position.set(0, 5, 0);
        let velocityY = 0, isGrounded = false;
        const gravity = -0.012;

        // Enemigo Jaguar
        const mobGroup = new THREE.Group();
        const bodyMesh = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.6, 1.2), new THREE.MeshLambertMaterial({ color: 0xe67e22 }));
        const headMesh = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.MeshLambertMaterial({ color: 0xd35400 }));
        headMesh.position.set(0, 0.3, -0.7);
        mobGroup.add(bodyMesh); mobGroup.add(headMesh);
        mobGroup.position.set(6, getTerrainHeight(6, 6) + 1, 6);
        scene.add(mobGroup);

        // Control Cámara Touch
        let lon = 0, lat = 0, touchStartX = 0, touchStartY = 0;
        const camZone = document.getElementById('touch-camera-zone');
        camZone.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: true });

        camZone.addEventListener('touchmove', (e) => {
            let dx = e.touches[0].clientX - touchStartX;
            let dy = e.touches[0].clientY - touchStartY;
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            lon += dx * 0.3;
            lat -= dy * 0.3;
            lat = Math.max(-80, Math.min(80, lat));
        }, { passive: true });

        // D-Pad Táctil
        let moveState = { forward: 0, side: 0 };
        const bindDpad = (id, fwd, side) => {
            const el = document.getElementById(id);
            const startHandler = (e) => { e.preventDefault(); moveState.forward = fwd; moveState.side = side; };
            const endHandler = (e) => { e.preventDefault(); moveState.forward = 0; moveState.side = 0; };
            
            el.addEventListener('touchstart', startHandler);
            el.addEventListener('touchend', endHandler);
            el.addEventListener('touchcancel', endHandler);
        };
        bindDpad('btn-up', 1, 0);
        bindDpad('btn-down', -1, 0);
        bindDpad('btn-left', 0, -1);
        bindDpad('btn-right', 0, 1);

        document.getElementById('btn-jump').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (isGrounded) { velocityY = 0.22; isGrounded = false; }
        });

        function toggleBuildMode() {
            buildMode = !buildMode;
            const txt = document.getElementById('mode-txt');
            txt.innerText = buildMode ? "COLOCAR" : "PICAR";
            txt.style.color = buildMode ? "#2ecc71" : "#e74c3c";
        }

        // Guía Esquema Movible
        let guideBlocks = [];
        let schemaPos = { x: 0, y: 2, z: -5 };

        function cambiarEsquema() {
            const type = document.getElementById('select-schema').value;
            const ctrl = document.getElementById('schema-controls');
            guideBlocks.forEach(b => scene.remove(b));
            guideBlocks = [];
            if (type === 'none') { ctrl.style.display = 'none'; return; }
            ctrl.style.display = 'block';
            renderizarGuiaEsquema(type);
        }

        function renderizarGuiaEsquema(type) {
            guideBlocks.forEach(b => scene.remove(b));
            guideBlocks = [];
            let pattern = [];
            if (type === 'altar') {
                pattern = [{x:0,y:0,z:0},{x:1,y:0,z:0},{x:-1,y:0,z:0},{x:0,y:0,z:1},{x:0,y:0,z:-1},{x:0,y:1,z:0}];
            } else if (type === 'piramide') {
                for(let x=-2; x<=2; x++) for(let z=-2; z<=2; z++) pattern.push({x:x, y:0, z:z});
                for(let x=-1; x<=1; x++) for(let z=-1; z<=1; z++) pattern.push({x:x, y:1, z:z});
                pattern.push({x:0, y:2, z:0});
            }
            pattern.forEach(p => {
                const g = new THREE.Mesh(geometry, materials.guide);
                g.position.set(schemaPos.x + p.x, schemaPos.y + p.y, schemaPos.z + p.z);
                scene.add(g);
                guideBlocks.push(g);
            });
        }

        function moverEsquema(dx, dz) {
            schemaPos.x += dx;
            schemaPos.z += dz;
            renderizarGuiaEsquema(document.getElementById('select-schema').value);
        }

        const raycaster = new THREE.Raycaster();
        const center = new THREE.Vector2(0, 0);

        function ejecutarAccion() {
            if (document.getElementById('login-modal').style.display !== 'none') return;
            raycaster.setFromCamera(center, camera);
            const intersects = raycaster.intersectObjects(blocks);

            if (intersects.length > 0) {
                const hit = intersects[0];
                if (buildMode) {
                    if (inventory[activeBlock] > 0) {
                        if (activeBlock === 'sapling') {
                            generarArbol(hit.object.position.x + hit.face.normal.x, hit.object.position.y + hit.face.normal.y, hit.object.position.z + hit.face.normal.z);
                        } else {
                            const newBlock = new THREE.Mesh(geometry, materials[activeBlock]);
                            newBlock.position.copy(hit.object.position).add(hit.face.normal);
                            newBlock.userData = { type: activeBlock };
                            scene.add(newBlock);
                            blocks.push(newBlock);
                        }
                        inventory[activeBlock]--;
                        score += 10;
                    }
                } else {
                    const bType = hit.object.userData.type || 'stone';
                    scene.remove(hit.object);
                    const idx = blocks.indexOf(hit.object);
                    if (idx > -1) blocks.splice(idx, 1);

                    if (inventory[bType] !== undefined) inventory[bType]++;
                    if (bType === 'leaves' && Math.random() < 0.4) inventory.sapling++;
                    score += 5;
                }
                actualizarUI();
            }
        }

        function selectSlot(type) {
            activeBlock = type;
            document.querySelectorAll('.slot').forEach(el => el.classList.remove('selected'));
            document.getElementById('slot-' + type).classList.add('selected');
        }

        function actualizarUI() {
            document.getElementById('hud-score').innerText = score;
            document.getElementById('hud-hp').innerText = hp;
            document.getElementById('cnt-wood').innerText = inventory.wood;
            document.getElementById('cnt-leaves').innerText = inventory.leaves;
            document.getElementById('cnt-sapling').innerText = inventory.sapling;
            document.getElementById('cnt-stone').innerText = inventory.stone;
            document.getElementById('cnt-grass').innerText = inventory.grass;
        }

        function ingresarAlJuego() {
            const u = document.getElementById('username').value.trim();
            const w = document.getElementById('world-name').value.trim();
            userPin = document.getElementById('user-pin').value.trim();
            if (u) currentUser = u;
            if (w) currentWorld = w;

            document.getElementById('hud-user').innerText = currentUser;
            document.getElementById('hud-world').innerText = currentWorld;
            document.getElementById('login-modal').style.display = 'none';
            actualizarUI();
        }

        function animate() {
            requestAnimationFrame(animate);

            velocityY += gravity;
            camera.position.y += velocityY;

            const floorH = getTerrainHeight(Math.round(camera.position.x), Math.round(camera.position.z)) + 1.8;
            if (camera.position.y <= floorH) {
                camera.position.y = floorH;
                velocityY = 0;
                isGrounded = true;
            }

            if (moveState.forward !== 0 || moveState.side !== 0) {
                const dirX = Math.sin(THREE.MathUtils.degToRad(lon));
                const dirZ = Math.cos(THREE.MathUtils.degToRad(lon));
                camera.position.x -= (dirX * moveState.forward + dirZ * moveState.side) * 0.12;
                camera.position.z -= (dirZ * moveState.forward - dirX * moveState.side) * 0.12;
            }

            const phi = THREE.MathUtils.degToRad(90 - lat);
            const theta = THREE.MathUtils.degToRad(lon);
            const target = new THREE.Vector3();
            target.x = camera.position.x + Math.sin(phi) * Math.cos(theta);
            target.y = camera.position.y + Math.cos(phi);
            target.z = camera.position.z + Math.sin(phi) * Math.sin(theta);
            camera.lookAt(target);

            // Jaguar AI
            if (mobGroup.position.distanceTo(camera.position) < 10) {
                mobGroup.lookAt(camera.position.x, mobGroup.position.y, camera.position.z);
                mobGroup.translateZ(0.02);
                if (mobGroup.position.distanceTo(camera.position) < 1.2) {
                    hp = Math.max(0, hp - 1);
                    actualizarUI();
                }
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>

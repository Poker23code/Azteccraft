<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AztecCraft 3D: Empire Edition</title>
    <style>
        * { touch-action: manipulation; box-sizing: border-box; }
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; background-color: #000; color: white; user-select: none; }
        
        #login-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 100;
        }
        .card { background: #222; padding: 25px; border-radius: 12px; border: 2px solid #8b4513; text-align: center; max-width: 380px; width: 90%; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: none; font-size: 15px; }
        button { background: #d9534f; color: white; font-weight: bold; cursor: pointer; }

        /* UI y Crosshair */
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 12px; height: 12px;
            transform: translate(-50%, -50%); pointer-events: none; z-index: 20;
        }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: white; }
        #crosshair::before { top: 5px; left: 0; width: 12px; height: 2px; }
        #crosshair::after { top: 0; left: 5px; width: 2px; height: 12px; }

        #hud { position: absolute; top: 10px; left: 10px; z-index: 10; text-shadow: 2px 2px 4px #000; font-size: 13px; pointer-events: none; }
        
        /* Hotbar de Inventario */
        #inventory {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 6px; background: rgba(0,0,0,0.7); padding: 6px; border-radius: 8px; z-index: 20;
        }
        .slot { width: 50px; height: 50px; border: 2px solid #aaa; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; cursor: pointer; background: rgba(0,0,0,0.5); }
        .slot.selected { border-color: #ffd700; box-shadow: 0 0 10px #ffd700; background: rgba(255,215,0,0.2); }

        /* Controles Táctiles Celular */
        .touch-btn {
            position: absolute; z-index: 20; background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.5); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: white; user-select: none;
        }
        #btn-jump { bottom: 80px; right: 20px; width: 60px; height: 60px; font-size: 12px; }
        #btn-action { bottom: 150px; right: 20px; width: 65px; height: 65px; background: rgba(217,83,79,0.5); font-size: 11px; }
        #mode-toggle { position: absolute; top: 10px; right: 10px; z-index: 20; background: rgba(0,0,0,0.8); padding: 8px 12px; border-radius: 6px; border: 1px solid #ffd700; font-size: 12px; }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div id="login-modal">
        <div class="card">
            <h2>🗿 AztecCraft 3D</h2>
            <input type="text" id="username" placeholder="Apodo / Nombre">
            <input type="password" id="userpin" placeholder="PIN Secreto">
            <input type="text" id="world-name" placeholder="Nombre del Mundo">
            <select id="mode-select">
                <option value="survival">🍃 Supervivencia</option>
                <option value="hardcore">💀 Hardcore</option>
            </select>
            <button type="button" onclick="ingresarAlJuego()">¡Jugar Minecraft Azteca!</button>
        </div>
    </div>

    <div id="crosshair"></div>

    <div id="hud">
        <div>👤 <span id="hud-user">Jugador</span> | 🌍 <span id="hud-world">Mundo</span></div>
        <div>🏆 Puntos: <span id="hud-score">0</span></div>
    </div>

    <div id="mode-toggle" onclick="toggleBuildMode()">Modo: <b id="action-label" style="color:#4cd137;">COLOCAR</b></div>

    <div id="btn-jump" class="touch-btn">SALTAR</div>
    <div id="btn-action" class="touch-btn" onclick="ejecutarAccion()">ACCION</div>

    <div id="inventory">
        <div class="slot selected" id="slot-grass" onclick="selectSlot('grass')">Pasto<br><span id="cnt-grass">∞</span></div>
        <div class="slot" id="slot-stone" onclick="selectSlot('stone')">Piedra<br><span id="cnt-stone">∞</span></div>
        <div class="slot" id="slot-wood" onclick="selectSlot('wood')">Madera<br><span id="cnt-wood">∞</span></div>
        <div class="slot" id="slot-gold" onclick="selectSlot('gold')">Oro<br><span id="cnt-gold">∞</span></div>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyBDE_6jIBeW-xAbPF7FWLsUlEDv4toHmVk",
          authDomain: "azteccraft-80bc2.firebaseapp.com",
          databaseURL: "https://azteccraft-80bc2-default-rtdb.firebaseio.com",
          projectId: "azteccraft-80bc2",
          storageBucket: "azteccraft-80bc2.firebasestorage.app",
          messagingSenderId: "854761490277",
          appId: "1:854761490277:web:a04e46bc093a6b5d64c38c"
        };
        
        let db = null;
        try { firebase.initializeApp(firebaseConfig); db = firebase.database(); } catch(e){}

        let currentUser = "Jugador", currentWorld = "Mundo1", currentMode = "survival";
        let score = 0, activeBlock = "grass", buildMode = true;

        // Escena 3D
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x7ec0ee);
        scene.fog = new THREE.FogExp2(0x7ec0ee, 0.02);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const light = new THREE.DirectionalLight(0xffffff, 1.2);
        light.position.set(20, 40, 20);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x666666));

        // Texturas/Materiales
        const materials = {
            grass: new THREE.MeshLambertMaterial({ color: 0x4aa02c }),
            stone: new THREE.MeshLambertMaterial({ color: 0x808080 }),
            wood: new THREE.MeshLambertMaterial({ color: 0x674111 }),
            gold: new THREE.MeshLambertMaterial({ color: 0xffd700 })
        };
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const blocks = [];

        // Generar Mapa Inicial
        for (let x = -10; x <= 10; x++) {
            for (let z = -10; z <= 10; z++) {
                const b = new THREE.Mesh(geometry, materials.grass);
                b.position.set(x, 0, z);
                scene.add(b);
                blocks.push(b);

                // Árboles aleatorios
                if (Math.random() < 0.03 && Math.abs(x) > 2 && Math.abs(z) > 2) {
                    for(let h=1; h<=3; h++) {
                        const trunk = new THREE.Mesh(geometry, materials.wood);
                        trunk.position.set(x, h, z);
                        scene.add(trunk);
                        blocks.push(trunk);
                    }
                }
            }
        }

        // Posición del Jugador
        camera.position.set(0, 2, 0);

        // Físicas y Movimiento
        let velocityY = 0;
        let isGrounded = false;
        const gravity = -0.015;

        // Controles de Rotación Cámara Táctil
        let touchStartX = 0, touchStartY = 0;
        let lon = 0, lat = 0;

        window.addEventListener('touchstart', (e) => {
            if (e.touches[0].clientX < window.innerWidth * 0.7) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (e.touches[0].clientX < window.innerWidth * 0.7) {
                const deltaX = e.touches[0].clientX - touchStartX;
                const deltaY = e.touches[0].clientY - touchStartY;
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;

                lon += deltaX * 0.3;
                lat -= deltaY * 0.3;
                lat = Math.max(-85, Math.min(85, lat));
            }
        });

        // Botón Saltar
        document.getElementById('btn-jump').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (isGrounded) { velocityY = 0.25; isGrounded = false; }
        });

        function toggleBuildMode() {
            buildMode = !buildMode;
            const lbl = document.getElementById('action-label');
            lbl.innerText = buildMode ? "COLOCAR" : "PICAR";
            lbl.style.color = buildMode ? "#4cd137" : "#e84118";
        }

        const raycaster = new THREE.Raycaster();
        const center = new THREE.Vector2(0, 0);

        function ejecutarAccion() {
            if (document.getElementById('login-modal').style.display !== 'none') return;

            raycaster.setFromCamera(center, camera);
            const intersects = raycaster.intersectObjects(blocks);

            if (intersects.length > 0) {
                const hit = intersects[0];
                if (buildMode) {
                    // Colocar Bloque
                    const newBlock = new THREE.Mesh(geometry, materials[activeBlock]);
                    newBlock.position.copy(hit.object.position).add(hit.face.normal);
                    scene.add(newBlock);
                    blocks.push(newBlock);
                    score += 10;
                } else {
                    // Picar Bloque
                    if (hit.object.position.y !== 0) { // No romper el piso base
                        scene.remove(hit.object);
                        const idx = blocks.indexOf(hit.object);
                        if (idx > -1) blocks.splice(idx, 1);
                        score += 5;
                    }
                }
                document.getElementById('hud-score').innerText = score;
                guardarEnNube();
            }
        }

        function ingresarAlJuego() {
            const u = document.getElementById('username').value.trim();
            const w = document.getElementById('world-name').value.trim();
            if (u) currentUser = u;
            if (w) currentWorld = w;

            document.getElementById('hud-user').innerText = currentUser;
            document.getElementById('hud-world').innerText = currentWorld;
            document.getElementById('login-modal').style.display = 'none';
        }

        function selectSlot(type) {
            activeBlock = type;
            document.querySelectorAll('.slot').forEach(el => el.classList.remove('selected'));
            document.getElementById('slot-' + type).classList.add('selected');
        }

        function guardarEnNube() {
            if (db && currentUser && currentWorld) {
                try {
                    db.ref(`ranking_supervivencia/${currentUser}_${currentWorld}`).set({
                        jugador: currentUser, mundo: currentWorld, score: score
                    });
                } catch(e){}
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            // Gravedad
            velocityY += gravity;
            camera.position.y += velocityY;

            if (camera.position.y <= 1.8) {
                camera.position.y = 1.8;
                velocityY = 0;
                isGrounded = true;
            }

            // Actualizar rotación de cámara
            const phi = THREE.MathUtils.degToRad(90 - lat);
            const theta = THREE.MathUtils.degToRad(lon);
            const target = new THREE.Vector3();
            target.x = camera.position.x + Math.sin(phi) * Math.cos(theta);
            target.y = camera.position.y + Math.cos(phi);
            target.z = camera.position.z + Math.sin(phi) * Math.sin(theta);
            camera.lookAt(target);

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
